
{% extends 'navbar.html' %}
{% block body %}

  <div class="container d-flex justify-content-center align-items-center py-5">
    <div class="card shadow p-4 w-100 max-width700px rounded-4 bg-white">
      <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='image/CAVT_logo.svg') }}" alt="شعار الكلية" class="rounded" width="140">
        <h2 class="mt-3 color-AB131C">ملاحظات الأسبوع الحالي</h2>
        <hr class="mt-2 mb-4">
      </div>
      <form method="get" class="mb-4 text-center">
        <label for="day" class="form-label fw-bold">اليوم:</label>
        <select name="day" id="day" class="form-select d-inline-block w-auto">
          <option value="" {% if not selected_day %}selected{% endif %}>كل الأيام</option>
          <option value="Sunday" {% if selected_day == 'Sunday' %}selected{% endif %}>الأحد</option>
          <option value="Monday" {% if selected_day == 'Monday' %}selected{% endif %}>الاثنين</option>
          <option value="Tuesday" {% if selected_day == 'Tuesday' %}selected{% endif %}>الثلاثاء</option>
          <option value="Wednesday" {% if selected_day == 'Wednesday' %}selected{% endif %}>الأربعاء</option>
          <option value="Thursday" {% if selected_day == 'Thursday' %}selected{% endif %}>الخميس</option>
          <option value="Friday" {% if selected_day == 'Friday' %}selected{% endif %}>الجمعة</option>
          <option value="Saturday" {% if selected_day == 'Saturday' %}selected{% endif %}>السبت</option>
        </select>
        <button type="submit" class="btn background-color-AB131C text-white mb-1 ms-2">فلترة</button>
      </form>

      {% for content, feedback_date, name in feedbacks %}
      <div class="card shadow-sm mb-3 rounded-4 note-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0 fw-bold color-AB131C">{{ name }}</h5>
            <small class="text-muted">{{ feedback_date }}</small>
          </div>
          <p class="card-text">{{ content }}</p>
        </div>
      </div>
      {% else %}
      <div class="alert alert-secondary text-center" role="alert">
        لا توجد ملاحظات  .
      </div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
